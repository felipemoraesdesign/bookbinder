<details class="nested wacky" id="single_sheet">
  <summary data-i18n="wacky_small_layouts">Folha única: zines e miniaturas</summary>
  <div class="more-body">
    <p class="callout" data-i18n="wacky_warn">
      Cada folha impressa vira um ou mais livrinhos. Valem só as opções de papel, impressão e
      páginas.
    </p>

    <div
      class="choices choices-compact"
      role="radiogroup"
      aria-label="Folha única: zines e miniaturas"
      data-i18n-tooltip="wacky_small_layouts"
    >
      <div class="choice-wrap">
        <label class="choice" for="8_zine">
          <input type="radio" id="8_zine" name="sig_format" value="8_zine" />
          <span class="choice-body">
            <span class="choice-title" data-i18n="sig_8_zine">Zine de folha única</span>
            <span class="choice-desc" data-i18n="sig_8_zine_small"
              >8 por face, impressa de um lado só, sem cortes</span
            >
          </span>
        </label>
        <details class="note">
          <summary data-i18n="instructions">Instruções</summary>
          <p>
            <span data-i18n="inst_8_zine"></span>
            <a
              href="https://www.quarantinepubliclibrary.com/tutorial"
              target="_blank"
              rel="noopener"
              >quarantinepubliclibrary.com/tutorial</a
            >
          </p>
        </details>
      </div>

      <div class="choice-wrap">
        <label class="choice" for="1_3rd">
          <input type="radio" id="1_3rd" name="sig_format" value="1_3rd" />
          <span class="choice-body">
            <span class="choice-title" data-i18n="sig_1_3rd">Terços</span>
            <span class="choice-desc" data-i18n="sig_1_3rd_small"
              >6 por face, cadernos de 3 fólios</span
            >
          </span>
        </label>
        <details class="note">
          <summary data-i18n="instructions">Instruções</summary>
          <p data-i18n="inst_1_3rd_p1"></p>
          <p data-i18n="inst_1_3rd_p2"></p>
        </details>
      </div>

      <div class="choice-wrap">
        <label class="choice" for="A7_2_16s">
          <input type="radio" id="A7_2_16s" name="sig_format" value="A7_2_16s" />
          <span class="choice-body">
            <span class="choice-title" data-i18n="sig_a7">Petite</span>
            <span class="choice-desc" data-i18n="sig_a7_small"
              >16 por face, 2 cadernos de 4 fólios</span
            >
          </span>
        </label>
        <details class="note">
          <summary data-i18n="instructions">Instruções</summary>
          <img class="diagram" src="/img/2_sig_4x4_diagram.png" alt="" />
          <p data-i18n="inst_a7"></p>
        </details>
      </div>

      <div class="choice-wrap">
        <label class="choice" for="a_3_6s">
          <input type="radio" id="a_3_6s" name="sig_format" value="a_3_6s" />
          <span class="choice-body">
            <span class="choice-title" data-i18n="sig_a3">Pequeno</span>
            <span class="choice-desc" data-i18n="sig_a3_small"
              >18 por face, 3 linhas de cadernos de 3 fólios</span
            >
          </span>
        </label>
        <details class="note">
          <summary data-i18n="instructions">Instruções</summary>
          <p class="callout callout-warn" data-i18n="landscape_warn"></p>
          <p data-i18n="test_print_warn"></p>
          <p data-i18n="inst_a3_p1"></p>
          <p data-i18n="fold_center_warn"></p>
        </details>
      </div>

      <div class="choice-wrap">
        <label class="choice" for="a9_3_3_4">
          <input type="radio" id="a9_3_3_4" name="sig_format" value="a9_3_3_4" />
          <span class="choice-body">
            <span class="choice-title" data-i18n="sig_a9">Pequenino</span>
            <span class="choice-desc" data-i18n="sig_a9_small"
              >20 por face, cadernos de 3, 3 e 4 fólios</span
            >
          </span>
        </label>
        <details class="note">
          <summary data-i18n="instructions">Instruções</summary>
          <img class="diagram" src="/img/3_3_4_diagram.png" alt="" />
          <p data-i18n="inst_a9"></p>
        </details>
      </div>

      <div class="choice-wrap">
        <label class="choice" for="a_4_8s">
          <input type="radio" id="a_4_8s" name="sig_format" value="a_4_8s" />
          <span class="choice-body">
            <span class="choice-title" data-i18n="sig_a4">Minúsculo</span>
            <span class="choice-desc" data-i18n="sig_a4_small"
              >32 por face, 4 linhas de cadernos de 4 fólios</span
            >
          </span>
        </label>
        <details class="note">
          <summary data-i18n="instructions">Instruções</summary>
          <p class="callout callout-warn" data-i18n="landscape_warn"></p>
          <p data-i18n="test_print_warn"></p>
          <p data-i18n="inst_a4_p1"></p>
          <p data-i18n="fold_center_warn"></p>
        </details>
      </div>

      <div class="choice-wrap">
        <label class="choice" for="a10_6_10s">
          <input type="radio" id="a10_6_10s" name="sig_format" value="a10_6_10s" />
          <span class="choice-body">
            <span class="choice-title" data-i18n="sig_a10">Mini</span>
            <span class="choice-desc" data-i18n="sig_a10_small"
              >60 por face, 6 linhas de cadernos de 2 e 3 fólios</span
            >
          </span>
        </label>
        <details class="note">
          <summary data-i18n="instructions">Instruções</summary>
          <p class="callout callout-warn" data-i18n="landscape_warn"></p>
          <p data-i18n="inst_a10_p1"></p>
          <img class="diagram" src="/img/6_10s_diagram.png" alt="" />
          <p data-i18n="inst_a10_p2"></p>
          <p data-i18n="fold_center_warn"></p>
        </details>
      </div>
    </div>

    <div class="grid-2">
      <label class="field">
        <span class="field-label" data-i18n="wacky_fore_edge">Margem de corte</span>
        <span class="field-unit">
          <input type="number" id="fore_edge_padding_pt" name="fore_edge_padding_pt" />
          <span>pt</span>
        </span>
      </label>
      <div class="field">
        <span class="field-label" data-i18n="wacky_spacing">Distribuição</span>
        <div
          class="seg"
          role="radiogroup"
          aria-label="Distribuição"
          data-i18n-tooltip="wacky_spacing"
        >
          <label
            ><input
              type="radio"
              id="wacky_pack"
              name="wacky_spacing"
              value="wacky_pack"
              checked
            /><span data-i18n="wacky_pack">Juntas</span></label
          >
          <label
            ><input type="radio" id="wacky_gap" name="wacky_spacing" value="wacky_gap" /><span
              data-i18n="wacky_gap"
              >Espaçadas</span
            ></label
          >
        </div>
      </div>
    </div>
  </div>
</details>
