<details class="panel" id="printer_info" open>
  <summary><span data-i18n="printer_title">Papel e impressora</span></summary>
  <div class="panel-body">
    <label class="field" for="paper_size">
      <span class="field-label" data-i18n="paper_size">Tamanho do papel</span>
      <select name="paper_size" id="paper_size"></select>
    </label>

    <div class="field">
      <span class="field-label" data-i18n="printer_type">Impressão</span>
      <div class="seg" role="radiogroup">
        <label
          ><input type="radio" name="printer_type" value="duplex" /><span data-i18n="type_duplex"
            >Frente e verso</span
          ></label
        >
        <label
          ><input type="radio" name="printer_type" value="single" /><span data-i18n="type_single"
            >Uma face</span
          ></label
        >
      </div>
      <small class="hint" data-i18n="duplex_tooltip">
        Duplex will alternate front and backs of sheets in a single file.
      </small>
    </div>

    <details class="more">
      <summary data-i18n="more_paper_options">Mais opções de papel</summary>
      <div class="more-body">
        <label class="field" for="paper_size_unit">
          <span class="field-label" data-i18n="paper_size_unit">Unidade da lista de papéis</span>
          <select name="paper_size_unit" id="paper_size_unit">
            <option data-i18n="unit_pt" value="pt">Pontos</option>
            <option data-i18n="unit_in" value="in">Polegadas</option>
            <option data-i18n="unit_cm" value="cm">Centímetros</option>
          </select>
        </label>

        <div class="field">
          <span class="field-label" data-i18n="dimensions_custom">Tamanho personalizado (pt)</span>
          <div class="pair">
            <input
              type="number"
              id="paper_size_custom_width"
              name="paper_size_custom_width"
              data-i18n-placeholder="width"
              placeholder="Largura"
            />
            <span aria-hidden="true">×</span>
            <input
              type="number"
              id="paper_size_custom_height"
              name="paper_size_custom_height"
              data-i18n-placeholder="height"
              placeholder="Altura"
            />
          </div>
          <small class="hint" data-i18n="custom_tooltip">
            The CUSTOM option will only appear if valid dimensions are provided.
          </small>
        </div>

        <label class="toggle">
          <span>
            <span data-i18n="rotate_paper_90">Papel deitado (paisagem)</span>
            <small class="hint" data-i18n="rotate_paper_tooltip"
              >This puts your paper in 'landscape'.</small
            >
          </span>
          <input type="checkbox" class="switch" name="paper_rotation_90" id="paper_rotation_90" />
        </label>

        <label class="toggle">
          <span>
            <span data-i18n="alternate_page_rotation">Virar pela borda longa</span>
            <small class="hint" data-i18n="alternate_page_rotation_hint"
              >Alterna a rotação das páginas no verso.</small
            >
          </span>
          <input type="checkbox" class="switch" name="rotate_page" />
        </label>
      </div>
    </details>
  </div>
</details>
