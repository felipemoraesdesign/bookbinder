<details class="panel classic-only">
  <summary><span data-i18n="pdf_markup_title">Marcas de impressão</span></summary>
  <div class="panel-body">
    <label class="toggle">
      <span>
        <span data-i18n="add_foldlines">Linhas de dobra</span>
        <small class="hint" data-i18n="foldlines_tooltip"
          >Ordenadas da mais grossa para a mais fina.</small
        >
      </span>
      <input type="checkbox" class="switch" name="cropmarks" />
    </label>
    <label class="toggle">
      <span>
        <span data-i18n="add_cutlines">Linhas de corte</span>
        <small class="hint" data-i18n="cutlines_tooltip">Guias para refilar.</small>
      </span>
      <input type="checkbox" class="switch" name="cutmarks" />
    </label>
    <label class="toggle">
      <span>
        <span data-i18n="add_pdf_bounds">Limites do PDF na lombada</span>
        <small class="hint" data-i18n="bounds_tooltip"
          >Marca topo e base do PDF no fólio externo de cada caderno.</small
        >
      </span>
      <input type="checkbox" class="switch" name="pdf_edge_marks" />
    </label>
    <label class="toggle">
      <span>
        <span data-i18n="add_sig_order">Ordem dos cadernos na lombada</span>
        <small class="hint" data-i18n="sig_order_tooltip"
          >Traços escalonados mostram a sequência dos cadernos.</small
        >
      </span>
      <input type="checkbox" class="switch" name="sig_order_marks" />
    </label>
    <label class="toggle">
      <span data-i18n="add_sewing_marks">Marcas de costura</span>
      <input
        type="checkbox"
        class="switch"
        id="add_sewing_marks_checkbox"
        name="add_sewing_marks_checkbox"
      />
    </label>

    <details class="nested" id="sewing_marks_details">
      <summary data-i18n="sewing_marks_details">Ajustes da costura</summary>
      <div class="more-body">
        <label class="field" for="sewing_mark_locations">
          <span class="field-label" data-i18n="draw_marks_on">Onde marcar</span>
          <select name="sewing_mark_locations" id="sewing_mark_locations">
            <option value="all" selected="selected" data-i18n="draw_all">
              Centro de cada fólio
            </option>
            <option value="only_out" data-i18n="draw_out">Só na lombada</option>
            <option value="only_in" data-i18n="draw_in">Só no centro do caderno</option>
            <option value="in_n_out" data-i18n="draw_in_out">Lombada e centro do caderno</option>
          </select>
        </label>
        <div class="grid-3">
          <label class="field">
            <span class="field-label" data-i18n="sewing_margin">Margem (A)</span>
            <span class="field-unit">
              <input type="number" id="sewing_marks_margin_pt" name="sewing_marks_margin_pt" />
              <span>pt</span>
            </span>
          </label>
          <label class="field">
            <span class="field-label" data-i18n="sewing_amount">Pontos (B)</span>
            <input type="number" id="sewing_marks_amount" name="sewing_marks_amount" />
          </label>
          <label class="field">
            <span class="field-label" data-i18n="sewing_tape_width">Fita (C)</span>
            <span class="field-unit">
              <input
                type="number"
                id="sewing_marks_tape_width_pt"
                name="sewing_marks_tape_width_pt"
              />
              <span>pt</span>
            </span>
          </label>
        </div>
        <img
          class="diagram"
          data-i18n-alt="sewing_img_alt"
          alt="Diagrama de costura: use fita de 0 pt para um ponto único"
          src="/img/sewing_settings_explanation.png"
        />
      </div>
    </details>
  </div>
</details>
