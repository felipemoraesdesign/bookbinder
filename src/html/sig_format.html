<details class="panel" id="sig_format" open>
  <summary><span data-i18n="sig_format_title">Encadernação</span></summary>
  <div class="panel-body">
    <div class="choices" role="radiogroup">
      <label class="choice" for="booklet">
        <input type="radio" id="booklet" name="sig_format" value="booklet" />
        <span class="choice-body">
          <span class="choice-title" data-i18n="booklet">Livreto</span>
          <span class="choice-desc" data-i18n="booklet_desc"
            >Um único caderno dobrado ao meio. Ideal para zines e grampo.</span
          >
        </span>
      </label>

      <label class="choice" for="standardsig">
        <input type="radio" id="standardsig" name="sig_format" value="standardsig" checked />
        <span class="choice-body">
          <span class="choice-title" data-i18n="standard_sig">Cadernos</span>
          <span class="choice-desc" data-i18n="standard_sig_desc"
            >Vários cadernos iguais, costurados juntos.</span
          >
          <span class="choice-extra">
            <span class="field-unit">
              <input
                type="number"
                value="8"
                min="1"
                name="sig_length"
                aria-describedby="sig_length_hint"
              />
              <span id="sig_length_hint" data-i18n="sig_length_tooltip">folhas por caderno</span>
            </span>
          </span>
        </span>
      </label>

      <label class="choice" for="customsig">
        <input type="radio" id="customsig" name="sig_format" value="customsig" />
        <span class="choice-body">
          <span class="choice-title" data-i18n="custom_sig">Cadernos personalizados</span>
          <span class="choice-desc" data-i18n="custom_sig_desc"
            >Defina quantas folhas vai em cada caderno.</span
          >
          <span class="choice-extra">
            <input
              type="text"
              name="custom_sig"
              placeholder="10, 10, 8"
              aria-describedby="custom_sig_hint"
            />
            <small class="hint" id="custom_sig_hint" data-i18n="custom_sig_tooltip"
              >Números separados por vírgula.</small
            >
          </span>
        </span>
      </label>

      <label class="choice" for="perfect">
        <input type="radio" id="perfect" name="sig_format" value="perfect" />
        <span class="choice-body">
          <span class="choice-title" data-i18n="perfectbound">Lombada quadrada</span>
          <span class="choice-desc" data-i18n="perfectbound_desc"
            >Folhas soltas, coladas na lombada.</span
          >
        </span>
      </label>
    </div>

    <details class="note">
      <summary data-i18n="calc_sig_lengths_title">Como contar folhas por caderno</summary>
      <p data-i18n="calc_sig_lengths_p">
        In this code, the length of a signature is the number of full-sized sheets of paper per
        signature.
      </p>
    </details>
  </div>
</details>
