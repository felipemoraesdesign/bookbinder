<details class="panel">
  <summary><span data-i18n="file_info_title">Páginas e arquivos</span></summary>
  <div class="panel-body">
    <label class="field" for="page_range">
      <span class="field-label" data-i18n="page_range">Intervalo de páginas</span>
      <input
        type="text"
        name="page_range"
        id="page_range"
        data-i18n-placeholder="page_range_placeholder"
        placeholder="Todas as páginas"
        aria-describedby="page_range_help"
      />
      <small class="hint" id="page_range_help" data-i18n="page_range_help"
        >Opcional. Ex.: 1-8 ou 1,3,5-7.</small
      >
    </label>

    <label class="field">
      <span class="field-label" data-i18n="add_flyleafs">Folhas de guarda</span>
      <span class="field-unit">
        <input type="number" name="flyleafs" value="1" min="0" aria-describedby="flyleafs_help" />
        <span data-i18n="sheets_unit">folhas</span>
      </span>
      <small class="hint" id="flyleafs_help" data-i18n="flyleafs_tooltip"
        >Páginas em branco no começo e no fim.</small
      >
    </label>

    <label class="field" for="print_file">
      <span class="field-label" data-i18n="generated_files">O que vem no .zip</span>
      <select name="print_file" id="print_file">
        <option value="aggregated" data-i18n="gen_aggregated">Só o arquivo completo</option>
        <option value="both" selected data-i18n="gen_both">
          Arquivo completo + um por caderno
        </option>
        <option value="signatures" data-i18n="gen_signatures">Só os arquivos por caderno</option>
      </select>
    </label>

    <p class="callout" data-i18n="file_warning">
      The first page, which is odd, will be on the right when printed.
    </p>
  </div>
</details>
