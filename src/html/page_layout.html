<details class="panel classic-only" open>
  <summary><span data-i18n="page_layout_title">Dobra e margens</span></summary>
  <div class="panel-body">
    <div class="field">
      <span class="field-label" data-i18n="layout_style">Páginas por face da folha</span>
      <div
        class="seg seg-4"
        role="radiogroup"
        aria-label="Páginas por face da folha"
        data-i18n-tooltip="layout_style"
      >
        <label
          ><input type="radio" name="pagelayout" value="folio" /><span
            ><b>2</b><small data-i18n="layout_folio">Fólio</small></span
          ></label
        >
        <label
          ><input type="radio" name="pagelayout" value="quarto" /><span
            ><b>4</b><small data-i18n="layout_quarto">Quarto</small></span
          ></label
        >
        <label
          ><input type="radio" name="pagelayout" value="octavo" /><span
            ><b>8</b><small data-i18n="layout_octavo">Oitavo</small></span
          ></label
        >
        <label
          ><input type="radio" name="pagelayout" value="sextodecimo" /><span
            ><b>16</b><small data-i18n="layout_sextodecimo">16º</small></span
          ></label
        >
      </div>
    </div>

    <details class="note">
      <summary data-i18n="folding_instructions_title">Como dobrar quarto e oitavo</summary>
      <p data-i18n="folding_p1"></p>
      <p>
        <span data-i18n="folding_p2_1"></span>
        <span data-i18n="folding_p2_quarto"></span>
        <span data-i18n="folding_p2_octavo"></span>
      </p>
    </details>

    <div id="book_size">
      <div class="grid-2">
        <label class="field" for="page_scaling">
          <span class="field-label" data-i18n="page_scaling">Escala</span>
          <select name="page_scaling" id="page_scaling">
            <option value="centered" data-i18n="scale_centered">Original</option>
            <option value="lockratio" selected data-i18n="scale_lockratio">Manter proporção</option>
            <option value="stretch" data-i18n="scale_stretch">Esticar</option>
          </select>
        </label>
        <label class="field" for="page_positioning">
          <span class="field-label" data-i18n="page_positioning">Posição</span>
          <select name="page_positioning" id="page_positioning">
            <option value="centered" selected data-i18n="pos_centered">Centralizada</option>
            <option value="binding_aligned" data-i18n="pos_aligned">Junto à lombada</option>
          </select>
        </label>
      </div>

      <div class="field">
        <span class="field-label"
          ><span data-i18n="margins_title">Margens extras</span> (<span class="unit-label">mm</span
          >)</span
        >
        <div class="margin-box">
          <label class="m-top">
            <input type="number" id="top_edge_padding_pt" name="top_edge_padding_pt" step="any" />
            <span data-i18n="top_margin">Superior</span>
          </label>
          <label class="m-binding">
            <input
              type="number"
              id="binding_edge_padding_pt"
              name="binding_edge_padding_pt"
              step="any"
            />
            <span data-i18n="binding_margin">Lombada</span>
          </label>
          <span class="m-page" aria-hidden="true"></span>
          <label class="m-fore">
            <input
              type="number"
              id="main_fore_edge_padding_pt"
              name="main_fore_edge_padding_pt"
              step="any"
            />
            <span data-i18n="fore_edge_margin">Corte</span>
          </label>
          <label class="m-bottom">
            <input
              type="number"
              id="bottom_edge_padding_pt"
              name="bottom_edge_padding_pt"
              step="any"
            />
            <span data-i18n="bottom_margin">Inferior</span>
          </label>
        </div>
        <small class="hint" data-i18n="white_space_help"
          >Relativas ao documento original. 1 pt = 1/72 pol.</small
        >
      </div>
    </div>
  </div>
</details>
