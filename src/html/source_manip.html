<details class="panel">
  <summary><span data-i18n="source_manip_title">Orientação do conteúdo</span></summary>
  <div class="panel-body">
    <label class="field" for="source_rotation">
      <span class="field-label" data-i18n="source_rotation_style">Rotação das páginas</span>
      <select name="source_rotation" id="source_rotation">
        <option id="none" value="none" selected="selected" data-i18n="rot_none">Sem rotação</option>
        <option id="90cw" value="90cw" data-i18n="rot_90cw">90° horário</option>
        <option id="90ccw" value="90ccw" data-i18n="rot_90ccw">90° anti-horário</option>
        <option id="out_binding" value="out_binding" data-i18n="rot_out_binding">
          Ímpares horário, pares anti-horário
        </option>
        <option id="in_binding" value="in_binding" data-i18n="rot_in_binding">
          Ímpares anti-horário, pares horário
        </option>
      </select>
    </label>

    <div id="none_example" class="source_rotation_example example">
      <img src="/img/noRotationDiagram.png" alt="" />
      <p data-i18n="rot_desc_none"></p>
    </div>
    <div id="90cw_example" class="source_rotation_example example">
      <img src="/img/90cwDiagram.png" alt="" />
      <p data-i18n="rot_desc_90cw"></p>
    </div>
    <div id="90ccw_example" class="source_rotation_example example">
      <img src="/img/90ccwDiagram.png" alt="" />
      <p data-i18n="rot_desc_90ccw"></p>
    </div>
    <div id="out_binding_example" class="source_rotation_example example">
      <img src="/img/bottomBindingDiagram.png" alt="" />
      <p data-i18n="rot_desc_out"></p>
    </div>
    <div id="in_binding_example" class="source_rotation_example example">
      <img src="/img/topBindingDiagram.png" alt="" />
      <p data-i18n="rot_desc_in"></p>
    </div>
  </div>
</details>
