<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Imposição de páginas para encadernação: envie um PDF e baixe as folhas prontas para imprimir, dobrar e costurar."
    />
    <title>Miolo</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/bookbinder.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Crimson+Pro:ital,wght@0,400;0,500;0,600;1,400&display=swap"
    />
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.js"></script>
  </head>

  <body data-state="empty">
    <header class="topbar">
      <a class="brand" href="./">
        <svg viewBox="16 16 224 224" aria-hidden="true">
          <path
            fill-rule="evenodd"
            d="M39 228A1 1 0 0 1 38 227L38 29A1 1 0 0 1 39 28L71.35 28A1 1 0 0 1 72.26 28.59L124.41 145.72A1 1 0 0 1 124.5 146.13L124.5 196.04A3 3 0 0 1 118.73 197.19L67.77 73.63A3 3 0 0 0 62 74.77L62 227A1 1 0 0 1 61 228Z M195 228A1 1 0 0 1 194 227L194 74.77A3 3 0 0 0 188.23 73.63L137.27 197.19A3 3 0 0 1 131.5 196.04L131.5 146.13A1 1 0 0 1 131.59 145.72L183.74 28.59A1 1 0 0 1 184.65 28L217 28A1 1 0 0 1 218 29L218 227A1 1 0 0 1 217 228Z"
          />
        </svg>
        <span>Miolo</span>
      </a>
      <span class="tagline" data-i18n="tagline">Imposição de páginas para encadernação</span>
      <div class="topbar-end">
        <span class="privacy">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="5" y="11" width="14" height="10" rx="2" />
            <path d="M8 11V8a4 4 0 0 1 8 0v3" />
          </svg>
          <span data-i18n="privacy_note">Seu PDF não sai do seu computador</span>
        </span>
        <div class="lang-switcher" role="group" data-i18n-tooltip="lang_label" aria-label="Idioma">
          <button type="button" id="btn-lang-pt" onclick="window.setLanguage('pt')">PT</button>
          <button type="button" id="btn-lang-en" onclick="window.setLanguage('en')">EN</button>
        </div>
      </div>
    </header>

    <form id="bookbinder" name="bookbinder" class="app">
      <main class="stage">
        <load src="src/html/stage.html" />
        <p class="credit" data-i18n="credit">
          Este app é um fork do bookbinder-js, criado por momijizukamori e colaboradores a partir do
          Bookbinder original.
        </p>
      </main>

      <aside class="inspector" data-i18n-tooltip="settings_label" aria-label="Configurações">
        <load src="src/html/presets.html" />
        <load src="src/html/sig_format.html" />
        <load src="src/html/printer.html" />
        <load src="src/html/page_layout.html" />
        <load src="src/html/file.html" />
        <load src="src/html/source_manip.html" />
        <load src="src/html/crop_box.html" />
        <load src="src/html/wacky.html" />

        <footer class="inspector-footer">
          <button
            type="button"
            name="reset_settings"
            id="reset_settings"
            class="link-btn"
            data-i18n-title="btn_reset_tooltip"
          >
            <span data-i18n="btn_reset">Restaurar padrões</span>
          </button>
          <span class="version">
            <span>v%PACKAGE_VERSION%</span>
            <a
              href="https://github.com/momijizukamori/bookbinder-js"
              target="_blank"
              rel="noopener"
              data-i18n="intro_repo_link"
              >GitHub</a
            >
          </span>
        </footer>
      </aside>
    </form>
  </body>
</html>
