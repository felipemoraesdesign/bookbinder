<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Imposição de páginas para encadernação: envie um PDF e baixe as folhas prontas para imprimir, dobrar e costurar."
    />
    <title>Miolo</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/miolo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;1,7..72,400&display=swap"
    />
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.js"></script>
  </head>

  <body data-state="empty">
    <header class="topbar">
      <a class="brand" href="./">
        <svg viewBox="0 0 256 256" aria-hidden="true">
          <path
            d="M159.09 176L53.09 176A7 7 0 0 1 53.09 162L159.09 162A7 7 0 0 1 159.09 176Z M53.09 206L159.09 206A7 7 0 0 1 159.09 220L53.09 220A7 7 0 0 1 53.09 206Z M53.09 162L53.09 176A15 15 0 0 0 53.09 206L53.09 220A29 29 0 0 1 53.09 162Z M159.09 132L53.09 132A7 7 0 0 1 53.09 118L159.09 118A7 7 0 0 1 159.09 132Z M53.09 162L159.09 162A7 7 0 0 1 159.09 176L53.09 176A7 7 0 0 1 53.09 162Z M53.09 118L53.09 132A15 15 0 0 0 53.09 162L53.09 176A29 29 0 0 1 53.09 118Z M159.09 88L53.09 88A7 7 0 0 1 53.09 74L159.09 74A7 7 0 0 1 159.09 88Z M53.09 118L159.09 118A7 7 0 0 1 159.09 132L53.09 132A7 7 0 0 1 53.09 118Z M53.09 74L53.09 88A15 15 0 0 0 53.09 118L53.09 132A29 29 0 0 1 53.09 74Z M30.14 164.72A7 7 0 0 1 30.14 173.28A29 29 0 0 1 34.2 169A29 29 0 0 1 30.14 164.72Z M30.14 120.72A7 7 0 0 1 30.14 129.28A29 29 0 0 1 34.2 125A29 29 0 0 1 30.14 120.72Z M38.59 77.89L109.51 36.94A7 7 0 0 1 116.51 49.06L45.59 90.01A7 7 0 0 1 38.59 77.89Z M113.01 36L224.91 36A7 7 0 0 1 224.91 50L113.01 50A7 7 0 0 1 113.01 36Z M228.41 49.06L162.59 87.06A7 7 0 0 1 155.59 74.94L221.41 36.94A7 7 0 0 1 228.41 49.06Z M231.91 43L231.91 175A7 7 0 0 1 217.91 175L217.91 43A7 7 0 0 1 231.91 43Z M228.41 181.06L162.59 219.06A7 7 0 0 1 155.59 206.94L221.41 168.94A7 7 0 0 1 228.41 181.06Z M166.09 81L166.09 213A7 7 0 0 1 152.09 213L152.09 81A7 7 0 0 1 166.09 81Z"
          />
        </svg>
        <span>Miolo</span>
      </a>
      <span class="tagline" data-i18n="tagline">Imposição de páginas para encadernação</span>
      <div class="topbar-end">
        <span class="privacy">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="5" y="11" width="14" height="10" rx="2" />
            <path d="M8 11V8a4 4 0 0 1 8 0v3" />
          </svg>
          <span data-i18n="privacy_note">Seu PDF não sai do seu computador</span>
        </span>
        <div class="lang-switcher" role="group" data-i18n-tooltip="lang_label" aria-label="Idioma">
          <button type="button" id="btn-lang-pt" onclick="window.setLanguage('pt')">PT</button>
          <button type="button" id="btn-lang-en" onclick="window.setLanguage('en')">EN</button>
        </div>
      </div>
    </header>

    <form id="bookbinder" name="bookbinder" class="app">
      <main class="stage">
        <load src="src/html/stage.html" />
        <p class="credit" data-i18n="credit">
          Este app é um fork do bookbinder-js, criado por momijizukamori e colaboradores a partir do
          Bookbinder original.
        </p>
      </main>

      <aside class="inspector" data-i18n-tooltip="settings_label" aria-label="Configurações">
        <load src="src/html/presets.html" />
        <load src="src/html/sig_format.html" />
        <load src="src/html/printer.html" />
        <load src="src/html/page_layout.html" />
        <load src="src/html/file.html" />
        <load src="src/html/source_manip.html" />
        <load src="src/html/crop_box.html" />

        <footer class="inspector-footer">
          <button
            type="button"
            name="reset_settings"
            id="reset_settings"
            class="link-btn"
            data-i18n-title="btn_reset_tooltip"
          >
            <span data-i18n="btn_reset">Restaurar padrões</span>
          </button>
          <span class="version">
            <span>v%PACKAGE_VERSION%</span>
            <a
              href="https://github.com/luizfelipermoraes/miolo"
              target="_blank"
              rel="noopener"
              data-i18n="intro_repo_link"
              >Código no GitHub</a
            >
          </span>
        </footer>
      </aside>
    </form>
  </body>
</html>
