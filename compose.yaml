services:
  miolo-app:
    # environment:
    #   BASE: '/miolo/' <-- is default in vite.config.js
    image: node:24
    volumes:
      - .:/app
    command: bash -c "cd /app && npm install && npm run build"

  miolo-nginx:
    image: nginx
    restart: unless-stopped
    volumes:
      - ./dist:/usr/share/nginx/html
